
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Grade Calculator</h1>

    <input type="text" id="studentName" placeholder="Enter Student Name">

    <input type="number" id="subject1" placeholder="Enter Marks for Subject 1">
    <input type="number" id="subject2" placeholder="Enter Marks for Subject 2">
    <input type="number" id="subject3" placeholder="Enter Marks for Subject 3">
    <input type="number" id="subject4" placeholder="Enter Marks for Subject 4">
    <input type="number" id="subject5" placeholder="Enter Marks for Subject 5">

    <button onclick="calculateGrade()">Calculate Result</button>

    <div class="result" id="output"></div>
</div>

<script>
    function calculateGrade() {

        // Variables
        let name = document.getElementById("studentName").value;

        let marks = [
            Number(document.getElementById("subject1").value),
            Number(document.getElementById("subject2").value),
            Number(document.getElementById("subject3").value),
            Number(document.getElementById("subject4").value),
            Number(document.getElementById("subject5").value)
        ];

        let total = 0;

        // Loop to calculate total marks
        for (let i = 0; i < marks.length; i++) {
            total += marks[i];
        }

        // Average calculation
        let average = total / marks.length;

        let grade = "";

        // Conditional statements for grade
        if (average >= 90) {
            grade = "A+";
        }
        else if (average >= 75) {
            grade = "A";
        }
        else if (average >= 60) {
            grade = "B";
        }
        else if (average >= 40) {
            grade = "C";
        }
        else {
            grade = "Fail";
        }

        // Display formatted output
        document.getElementById("output").innerHTML = `
            <h3>Result</h3>
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Total Marks:</strong> ${total}</p>
            <p><strong>Average:</strong> ${average.toFixed(2)}%</p>
            <p><strong>Grade:</strong> ${grade}</p>
        `;
    }
</script>

</body>
</html>
